name: Uptime check

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check site and Supabase
        run: |
          set -euo pipefail

          curl -fsS --max-time 20 "https://ansverd0.github.io/psychology-portal/index.html" > /dev/null
          curl -fsS --max-time 20 "https://ansverd0.github.io/psychology-portal/sw.js" > /dev/null

          KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' js/supabase-config.js | head -n 1)
          test -n "$KEY"
          curl -fsS --max-time 20 \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "https://lrjszannmammzzqotaro.supabase.co/rest/v1/version_control?select=version&limit=1" > /dev/null

      - name: Check last successful DB backup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          LAST=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/backup.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].updated_at // empty')

          if [ -z "$LAST" ]; then
            echo "::error::Нет ни одного успешного запуска Backup database."
            exit 1
          fi

          AGE_H=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 3600 ))
          echo "Последний успешный бэкап: $LAST (${AGE_H} ч назад, порог 26 ч)."

          if [ "$AGE_H" -ge 26 ]; then
            echo "::error::Резервная копия старше 26 часов: последний успешный запуск $LAST."
            exit 1
          fi

      - name: Open incident issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create incident --color d73a4a --description "Автоматически: портал недоступен" 2>/dev/null || true
          EXISTING=$(gh issue list --state open --label incident --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            gh issue create \
              --title "Портал недоступен или нет свежей копии БД (автопроверка)" \
              --label incident \
              --body "Проверка $(date -u +%Y-%m-%dT%H:%MZ) не смогла открыть сайт/Supabase либо последний успешный Backup database старше 26 ч. Проверьте GitHub Pages, последний деплой, статус Supabase и журнал backup.yml."
          else
            gh issue comment "$EXISTING" --body "Проверка $(date -u +%Y-%m-%dT%H:%MZ): портал недоступен или резервная копия БД устарела."
          fi

      - name: Close incident issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --state open --label incident --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Проверка $(date -u +%Y-%m-%dT%H:%MZ): портал снова доступен."
          fi
