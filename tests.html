<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивные тесты / Психология</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Мета-теги для правильного отображения ссылки в Telegram и соцсетях -->
    <meta property="og:title" content="Интерактивные тесты / Психология">
    <meta property="og:description" content="Единый учебный портал с базой знаний, экзаменационными билетами, тренажёрами понятий и тестами по профильным дисциплинам семестра.">
    <meta property="og:url" content="https://vercel.app">
</head>

<body>
    <header>
        <a href="index.html" class="back-link">⬅️ Вернуться в главное меню</a>
        <h1>Интерактивные тесты</h1>
        <p>Проверьте свои знания по психологии</p>
        <h2>Проверьте уровень своих знаний перед экзаменом. После каждого ответа система покажет правильный вариант и ваш текущий балл.</h2>
    </header>

    <main>
        <div class="quiz-limit-wrapper">
    <label for="quiz-limit-select">Количество вопросов в тесте:</label>
    <div class="custom-select-container">
        <select id="quiz-limit-select">
            <option value="5">5 вопросов</option>
            <option value="10" selected>10 вопросов</option>
            <option value="20">20 вопросов</option>
            <option value="30">30 вопросов</option>
            <option value="all">Все доступные</option>
        </select>
    </div>
</div>


        <!-- Плитки выбора дисциплин для тестов -->
        <div id="quiz-discipline-tiles" class="mobile-only-tiles" style="display: flex !important; max-width: 600px; margin: 0 auto 20px auto;"></div>
        <!-- Контейнер самого теста -->
        <div id="quiz-wrapper" class="quiz-card">
            <div class="quiz-header">
                <span id="quiz-progress">Вопрос 0 из 0</span>
            </div>
            
            <h2 id="quiz-question">Загрузка вопроса...</h2>
            
            <!-- Сюда JavaScript будет вставлять варианты ответов -->
            <div id="quiz-options" class="options-container"></div>
            
            <div class="quiz-footer">
                <button id="quiz-next-btn" style="display: none;">Следующий вопрос ➡️</button>
            </div>
        </div>

        <!-- Контейнер для результатов (изначально скрыт) -->
        <div id="result-wrapper" class="quiz-card" style="display: none;">
            <h2>Тест завершен! 🎉</h2>
            <p class="result-score">Ваш результат: <span id="score-text">0 из 0</span></p>
            <p id="result-feedback"></p>
            <button onclick="location.reload()">Пройти заново 🔄</button>
        </div>
    </main>

    <script src="script.js"></script>
    <!-- Невидимый блок-буфер, который удерживает нижнюю границу страницы -->
<div class="page-bottom-buffer"></div>

</body>
</html>
