<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Разделы психологии</title>
    <!-- Надежное незаблокированное подключение клиента базы данных -->
<script src="js/vendor/supabase.js"></script>

    <link rel="stylesheet" href="style.css">
    <script src="js/vendor/dompurify.min.js"></script>
    
    <!-- Мета-теги для правильного отображения ссылки в Telegram и соцсетях -->
    <meta property="og:title" content="Разделы психологии">
    <meta property="og:description" content="Единый учебный портал с базой знаний, экзаменационными билетами, тренажёрами понятий и тестами по профильным дисциплинам семестра.">
    <meta property="og:url" content="https://ansverd0.github.io/psychology-portal/sections.html">
    <script src="js/analytics.js" defer></script>
</head>

<body>
    <header>
        <a href="index.html" class="capsule-back-btn">Главное меню</a>
        <h1>Разделы психологии</h1>
        <h2>Интерактивная база знаний по отраслям психологии. Нажимайте на папки отраслей слева, чтобы открыть список доступных статей. Ключевые термины подсвечены синим цветом — наведите на них для вызова подсказки.</h2>
    </header>

    <main id="sections-page-marker" class="tri-column-layout">

    <div class="nav-left">
    
    <!-- 🗂 КОЛОНКА 1: Поиск и папки разделов -->
    <aside class="tickets-sidebar nav-pane">

    <!-- Мобильный поиск -->
    <div class="mobile-search-wrapper" style="position: relative;">
        <input type="text" id="mobile-search-input" placeholder="🔍 Поиск темы по названию...">
        <div id="mobile-search-results" class="search-results-dropdown" style="display: none;"></div>
    </div>

    <!-- 📱 Контейнер для мобильных плиток-разделов (карусель/сетка) -->
    <div id="mobile-sections-tiles" class="mobile-only-tiles limited-tiles"></div>

    <!-- Папки разделов -->
    <div id="sections-folders-col" class="tickets-folders-column"></div>

    </aside>

    <!-- 🗒 КОЛОНКА 2: Содержимое выбранной папки (статьи) -->
    <aside class="tickets-contents nav-pane">

    <!-- Контейнер для вложенного списка статей (общий для поиска и плиток на мобилке) -->
    <div id="mobile-articles-list" class="mobile-articles-container limited-articles" style="display: none;"></div>

    <!-- Список статей выбранного раздела -->
    <div id="sections-articles-col" class="tickets-questions-column">
        <div class="questions-placeholder">Выберите раздел слева</div>
    </div>

    </aside>

    </div><!-- /nav-left -->

    <!-- Правая колонка: Окно просмотра статьи -->
    <div class="section-viewer">
        <!-- Сюда подгружается контент статьи -->
    </div>

    <!-- ⭐ Правая колонка: Закладки (только на ПК) -->
    <div class="bookmarks-panel" id="bookmarks-panel">
        <!-- Рендерится через JS -->
    </div>

</main>


    <script src="js/supabase-config.js"></script>
<script src="js/bookmarks.js"></script>
<script src="js/sections-wiki.js"></script>
<!-- Нижний дублирующий блок навигации -->
    <div style="margin: 40px 0; text-align: center;">
        <a href="index.html" class="capsule-back-btn">Главное меню</a>
        <br>
        <a href="privacy.html" class="footer-link">Политика данных</a>
    </div>

    <!-- Кнопка быстрой прокрутки наверх -->
    <button id="scroll-top-btn" title="Наверх">▲</button>
</body>
</html>
