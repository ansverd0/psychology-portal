<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер терминов | Психология</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="back-link">⬅️ Вернуться в главное меню</a>
        <h1>Тренажер терминов</h1>
        <p>Интерактивные флэш-карточки для подготовки к ГОСу</p>
        <h2>Интерактивные флэш-карты для запоминания ключевых понятий. Кликните на карточку, чтобы перевернуть её и увидеть определение.</h2>
    </header>

    <main>
        <div class="card-perspective">
            <div class="flash-card" id="myCard">
                <div class="card-side card-front">
                    <h2 id="term-text">Загрузка...</h2>
                    <span class="tap-hint">Кликните, чтобы узнать определение</span>
                </div>
                <div class="card-side card-back">
                    <p id="definition-text">Загрузка...</p>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="prev-btn">⬅️ Назад</button>
            <span id="counter-text">0 / 0</span>
            <button id="next-btn">Вперед ➡️</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
