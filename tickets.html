<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экзаменационные билеты | Психология</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="back-link">⬅️ Вернуться в главное меню</a>
        <h1>Экзаменационные билеты</h1>
        <p>Изучение конспектов и литературы к экзаменам, зачётам и семинарам</p>
        <h2>Удобные структурированные конспекты с привязкой к авторитетной учебной литературе.</h2>
    </header>

    <main class="tickets-layout">
    
    <!-- 🗂 ЛЕВАЯ КОЛОНКА: Навигация (Автоматически подстраивается под ПК и Мобильные) -->
    <div class="tickets-sidebar">
        
        <!-- 1. Мобильная строка поиска по вопросам (скроется на ПК) -->
        <div class="mobile-search-wrapper" style="position: relative;">
            <input type="text" id="mobile-tickets-search" placeholder="🔍 Найти экзаменационный вопрос...">
            <div id="mobile-tickets-search-results" class="search-results-dropdown" style="display: none;"></div>
        </div>

        <!-- 2. Мобильные плитки-дисциплины (Вариант 2 — скроются на ПК) -->
        <div id="mobile-tickets-tiles" class="mobile-only-tiles"></div>

        <!-- 3. Мобильный список вопросов выбранного экзамена (скроется на ПК) -->
        <div id="mobile-questions-list" class="mobile-articles-container" style="display: none;"></div>

        <!-- 4. ПК-версия: Двухуровневый аккордеон папок (скроется на смартфонах) -->
        <div id="tickets-list-desktop" class="desktop-only-list"></div>
        
    </div>

    <!-- 📄 ПРАВАЯ КОЛОНКА: Интерактивное окно просмотра конспекта (Общее для ПК и Мобилок) -->
    <div class="ticket-viewer">
        <div class="empty-state">
            <p>📋 Выберите экзаменационную дисциплину слева, чтобы открыть список вопросов и конспекты ответов.</p>
        </div>
    </div>

</main>

    <script src="script.js"></script>
</body>
</html>
