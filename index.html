<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портал подготовки к ГОСам | Психология</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Психология образования: Тренажер терминов</h1>
        <p>Интерактивные флэш-карточки для подготовки к ГОСам</p>
    </header>

    <main>
        <!-- Контейнер для 3D-эффекта -->
        <div class="card-perspective">
            <div class="flash-card" id="myCard">
                <!-- Лицевая сторона (Термин) -->
                <div class="card-side card-front">
                    <h2 id="term-text">Загрузка...</h2>
                    <span class="tap-hint">Кликните, чтобы узнать определение</span>
                </div>
                <!-- Обратная сторона (Определение) -->
                <div class="card-side card-back">
                    <p id="definition-text">Загрузка...</p>
                </div>
            </div>
        </div>

        <!-- Кнопки управления -->
        <div class="controls">
            <button id="prev-btn">⬅️ Назад</button>
            <span id="counter-text">0 / 0</span>
            <button id="next-btn">Вперед ➡️</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
